name: folio_reader
description: Folio -- Book reader supporting EPUB, FB2, TXT, HTML, PDF
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  provider: ^6.1.1
  google_fonts: ^6.1.0
  xml: ^6.5.0
  archive: ^3.6.1
  html: ^0.15.4
  shared_preferences: ^2.2.2
  http: ^1.2.0

  # Audio + TTS (cross-platform)
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.2

  # Mobile-specific (work also on web with no-op or fallback)
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  permission_handler: ^11.3.1

  # PDF rendering (cross-platform: Android, iOS, Web — uses PDFium under the hood)
  pdfrx: ^1.0.96

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/sounds/ambience/